<!doctype html>
<html lang="en" style="background-color: #FAF5EF;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- Primary Meta Tags -->
    <meta name="description" content="HeartOut - A safe, empathetic storytelling platform where you can anonymously share achievements, regrets, unsent letters, sacrifices, and life stories. Where every story matters." />
    <meta name="keywords" content="storytelling, anonymous stories, personal stories, achievements, regrets, unsent letters, mental health, emotional support, share stories, life experiences, confession, journal, therapeutic writing" />
    <meta name="author" content="HeartOut" />
    <meta name="robots" content="index, follow" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#FAF5EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#C85828" />
    
    <!-- Immediate Canvas and Root Atmosphere Styles -->
    <style>
      :root, html, body {
        background-color: #FAF5EF !important;
        margin: 0;
        padding: 0;
      }
      html.dark, html.dark body {
        background-color: #0F0E0C !important;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://heartout.vercel.app/" />
    <meta property="og:title" content="HeartOut - Personal Storytelling Platform" />
    <meta property="og:description" content="A safe space for anonymous storytelling. Share your achievements, regrets, unsent letters, and life stories." />
    <meta property="og:image" content="https://heartout.vercel.app/og-image.png" />
    <meta property="og:site_name" content="HeartOut" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://heartout.vercel.app/" />
    <meta name="twitter:title" content="HeartOut - Personal Storytelling Platform" />
    <meta name="twitter:description" content="A safe space for anonymous storytelling. Share your achievements, regrets, unsent letters, and life stories." />
    <meta name="twitter:image" content="https://heartout.vercel.app/og-image.png" />
    
    <!-- Google Fonts: Poppins (headings) + Inter (body) + DM Serif Display + Satisfy (signature) + Instrument Serif + Syne -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=DM+Serif+Display&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Satisfy&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <title>HeartOut - Personal Storytelling Platform</title>
  </head>
  <body style="background-color: #FAF5EF; margin: 0; padding: 0;">
    <script>
      // Apply theme and background immediately to prevent flash and eliminate white overscroll canvas
      (function() {
        try {
          const saved = localStorage.getItem('heartout-theme-preferences');
          let isDark = false;
          if (saved) {
            const prefs = JSON.parse(saved);
            const theme = prefs.theme;
            if (theme === 'dark') {
              isDark = true;
            } else if (theme === 'light') {
              isDark = false;
            } else {
              isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          const root = document.documentElement;
          const bg = isDark ? '#0F0E0C' : '#FAF5EF';
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.style.colorScheme = 'light';
          }
          root.style.backgroundColor = bg;
          if (document.body) {
            document.body.style.backgroundColor = bg;
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
